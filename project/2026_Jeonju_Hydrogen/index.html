pt id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"projectData":{"id":"2026_Jeonju_Hydrogen","title":"전주 수소놀이체험관","hidden":false,"tags":["exhibition","education","interactive","science","ai","kiosk","media-art","game"],"images":["FutureJob_001.jpg","Mobility_001.jpg","FutureCity_001.jpg"],"thumbnail":"FutureJob_001.jpg","description":"수소 에너지를 놀이로 배우는 어린이 체험관 전관 인터랙티브 전시 콘텐츠","year":"2026","location":"전북특별자치도, 전주","latlng":[35.8110561,127.1630838],"country":"KR","lastmod":"2026-11-10","sections":[{"type":"text","title":"수소놀이체험관 (Hydrogen Play Center)","content":"전주 수소놀이체험관에 납품한 체험형 전시 콘텐츠입니다.\n어린이 눈높이에서 수소 에너지를 놀이로 배울 수 있도록, 2층 '미래 수소 마을'과 3층 '수소의 오늘 전주'로 이어지는 체험관의 인터랙티브 콘텐츠를 제작했습니다.\n관람객은 입구에서 수소 도시 앱을 설치해 '수소 도시 시민 카드'를 발급받고, 전시를 돌며 나의 수소 미래 직업을 찾고 미래 도시를 함께 만들어가는 하나의 스토리로 체험이 이어집니다."},{"type":"exhibits","title":"주요 전시물","items":[{"title":"수소 도시 안내소","description":"체험관 입구에서 '미래 수소 도시'의 시민이 되는 등록 공간입니다.\n\nQR 코드를 스캔해 수소 도시 앱을 설치하고 시민 카드를 발급받으면, 전시를 돌며 직업 찾기와 도시 만들기 체험이 앱과 연동되어 하나의 여정으로 이어집니다.","tags":["information","mobile","experience"],"images":["CityInfo_001.jpg"]},{"title":"종합 안내 키오스크","description":"체험관 소개, 전시·체험 안내, 층별 안내, 수소 사진관 기능을 담은 벽부형 터치 키오스크입니다.\n\n카메라가 내장되어 수소 사진관에서 기념 사진을 촬영할 수 있습니다.","tags":["kiosk","information","touchscreen","photo"],"images":["InfoKiosk_001.jpg"],"relatedSolution":{"id":"Solution_InfoKiosk","title":"정보 키오스크 솔루션"}},{"title":"수소 모빌리티","description":"수소 자동차의 작동 원리를 배우는 인터랙티브 키오스크입니다.\n\n화면 속 수소 자동차를 터치로 움직이며 수소탱크부터 물 배출까지 5단계 작동 원리를 체험하고, 실물 차량 모형과 벽면 그래픽이 함께 공간을 구성합니다.","tags":["kiosk","interactive","education","science"],"images":["Mobility_001.jpg"]},{"title":"수소미래직업발견","description":"나에게 어울리는 수소 미래 직업을 찾아보는 몰입형 프로젝션 체험입니다.\n\n미래 수소 도시를 배경으로 한 대형 프로젝션에서 질문에 답하며 나만의 직업을 발견하고, 시민 카드에 기록해 다음 체험으로 이어갑니다.","tags":["interactive","media-art","experience","education"],"images":["FutureJob_001.jpg"]},{"title":"수소 OX 퀴즈","description":"팀으로 즐기는 대형 프로젝션 OX 퀴즈입니다.\n\n문제를 읽고 5초 동안 O 또는 X를 여러 번 터치하면, 더 많이 터치한 쪽이 우리 팀의 답이 되는 방식으로 여럿이 함께 수소 상식을 배웁니다.","tags":["game","interactive","education","multi-player"],"images":["OXQuiz_001.jpg"]},{"title":"수소 AI 밸류 체인","description":"AI 도슨트와 함께 수소 에너지의 생산부터 활용까지 밸류 체인을 탐험하는 체험입니다.\n\n테이블 매립형 터치스크린에서 수소 에너지의 여정을 살펴보고, 마이크를 켜면 대형 LED 기둥 속 AI 휴머노이드 도슨트에게 음성으로 질문하고 답을 들을 수 있습니다.","tags":["ai","docent","interactive","touchscreen"],"images":["ValueChain_001.jpg","ValueChain_002.jpg"],"relatedSolution":{"id":"Solution_AI","title":"AI 활용 솔루션"}},{"title":"전주 수소 디오라마","description":"전통과 미래를 잇는 수소 도시 전주를 담은 디오라마 연출입니다.\n\n수소 생산·저장·이송·활용 과정을 도시 모형과 대형 영상이 연동되어 보여주며, 버튼을 누르면 해당 구간이 모형 위에서 함께 연출됩니다.","tags":["display","media-art","education"],"images":["Diorama_001.jpg"]},{"title":"수소로 만드는 미래도시","description":"수소로 움직이는 2050년 그린 수소 전주를 함께 건설하는 협동 시뮬레이션 게임입니다.\n\n2대의 키오스크에서 각자 건물을 설계하면 대형 프로젝션 속 도시에 차곡차곡 지어지고, 관람객들이 함께 만든 도시가 누적되어 성장합니다.","tags":["game","interactive","simulation","multi-player"],"images":["FutureCity_001.jpg"]}]}]}},"__N_SSG":true},"page":"/project/[projectId]","query":{"projectId":"2026_Jeonju_Hydrogen"},"buildId":"zpk2xZzDLEtIiX2kUQfH7","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
